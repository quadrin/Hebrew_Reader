<!-- Lavan's icon: a hoopoe — דּוּכִיפַת, Israel's national bird, and the one
     that reads as Hebrew without printing a letter on the icon. It replaced
     an א with a gold dot, which said "Hebrew" but not "reader" and looked
     like every other alef icon in the store.

     Flat shapes, no strokes or gradients, in the app's blue and paper white
     with the gold the old icon used for its dot. Everything that carries the
     bird is big: the fanned crest, the long bill, one round eye. The wing
     bars and the tail are the first things to blur when it is shrunk to a
     favicon, which is why nothing depends on them.

     This file is the only drawing. npm run build:icons renders it into the
     PNGs iOS and Android want, and into the inline favicon in index.html. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- one crest feather, fanned five times around the top of the head -->
    <g id="feather">
      <path fill="#F5F3ED" d="M216 62 C226 62 231 76 232 98 C234 142 234 200 232 242 L200 242 C198 200 198 142 200 98 C201 76 206 62 216 62 Z"/>
      <path fill="#F2C94C" d="M216 62 C226 62 231 76 232 98 C232 106 232 114 232 122 L200 122 C200 114 200 106 200 98 C201 76 206 62 216 62 Z"/>
    </g>
  </defs>

  <rect width="512" height="512" rx="112" fill="#1D4E89"/>

  <!-- the bird, held a little in from the edges -->
  <g transform="translate(256 262) scale(0.92) translate(-256 -262)">
    <g>
      <use href="#feather" transform="rotate(-34 216 236)"/>
      <use href="#feather" transform="rotate(-17 216 236)"/>
      <use href="#feather"/>
      <use href="#feather" transform="rotate(17 216 236)"/>
      <use href="#feather" transform="rotate(34 216 236)"/>
    </g>

    <!-- legs, drawn before the body so they tuck under it -->
    <g stroke="#F2C94C" stroke-width="16" stroke-linecap="round" fill="none">
      <path d="M234 400 L234 438"/><path d="M288 400 L288 438"/>
      <path d="M216 442 L252 442"/><path d="M270 442 L306 442"/>
    </g>

    <!-- tail, swept down and back -->
    <g transform="rotate(-36 214 340)">
      <rect x="64" y="324" width="152" height="32" rx="16" fill="#F5F3ED"/>
    </g>

    <g fill="#F5F3ED">
      <ellipse cx="262" cy="320" rx="108" ry="96"/>
      <circle cx="216" cy="236" r="78"/>
    </g>

    <!-- the barred wing, two strokes of it -->
    <g fill="#1D4E89" transform="rotate(-8 250 330)">
      <rect x="196" y="298" width="104" height="20" rx="10"/>
      <rect x="190" y="338" width="116" height="20" rx="10"/>
    </g>

    <path fill="#F2C94C" d="M286 222 C338 228 388 244 424 270 C382 268 334 262 286 256 Z"/>

    <circle cx="252" cy="212" r="22" fill="#1D4E89"/>
    <circle cx="245" cy="203" r="8" fill="#F5F3ED"/>
  </g>
</svg>
