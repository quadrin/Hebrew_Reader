<!-- Lavan's icon: a hoopoe — דּוּכִיפַת, Israel's national bird, which says
     Hebrew without printing a letter on the icon.

     Drawn from the bird rather than from the idea of a bird, because a
     crested cartoon bird is a cockatoo. What makes a hoopoe a hoopoe, in
     order of how far away you can still tell: the crest fanned open, each
     feather cinnamon with a white band and a black tip; the long thin bill
     curving down; the wing barred black and white; the black tail with its
     white band. Cinnamon head and breast, pale belly.

     Flat shapes, no strokes or gradients. The app's blue behind it, its
     paper white and its ink for the bars, and a cinnamon that the palette
     did not have. The crest, the bill and the eye carry it at every size;
     the barring and the tail are the first things to go when it is shrunk
     to a favicon, so nothing depends on them.

     This file is the only drawing. npm run build:icons renders it into the
     PNGs iOS and Android want, and into the inline favicon in index.html. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- one crest feather, fanned seven times around the crown -->
    <g id="feather">
      <rect x="305" y="46" width="32" height="202" rx="16" fill="#DE9448"/>
      <rect x="305" y="46" width="32" height="44" rx="16" fill="#F5F3ED"/>
      <rect x="305" y="46" width="32" height="26" rx="13" fill="#1B2432"/>
    </g>
    <!-- the folded wing, which the bars are cut to -->
    <clipPath id="wing">
      <ellipse cx="214" cy="316" rx="98" ry="54" transform="rotate(-18 214 316)"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="#1D4E89"/>

  <!-- the bird, held a little in from the edges -->
  <g transform="translate(256 272) scale(0.9) translate(-256 -272)">
    <g>
      <use href="#feather" transform="rotate(-50 321 244)"/>
      <use href="#feather" transform="rotate(-36 321 244)"/>
      <use href="#feather" transform="rotate(-23 321 244)"/>
      <use href="#feather" transform="rotate(-10 321 244)"/>
      <use href="#feather" transform="rotate(3 321 244)"/>
      <use href="#feather" transform="rotate(16 321 244)"/>
      <use href="#feather" transform="rotate(29 321 244)"/>
    </g>

    <!-- legs and tail go down first, so the body sits over them -->
    <g stroke="#1B2432" stroke-width="15" stroke-linecap="round" fill="none">
      <path d="M222 412 L222 446"/><path d="M270 412 L270 446"/>
      <path d="M206 450 L238 450"/><path d="M254 450 L286 450"/>
    </g>
    <g transform="rotate(18 148 352)">
      <rect x="14" y="332" width="162" height="46" rx="14" fill="#1B2432"/>
      <rect x="44" y="332" width="32" height="46" fill="#F5F3ED"/>
    </g>

    <ellipse cx="232" cy="340" rx="122" ry="88" fill="#F5F3ED"/>
    <g clip-path="url(#wing)">
      <g fill="#1B2432" transform="rotate(-68 214 316)">
        <rect x="128" y="228" width="26" height="180"/>
        <rect x="176" y="228" width="26" height="180"/>
        <rect x="224" y="228" width="26" height="180"/>
        <rect x="272" y="228" width="26" height="180"/>
      </g>
    </g>

    <!-- head, neck and breast, in one cinnamon piece -->
    <g fill="#DE9448">
      <ellipse cx="304" cy="334" rx="52" ry="66"/>
      <circle cx="321" cy="248" r="62"/>
      <path d="M272 258 C264 300 272 348 290 380 L342 372 C320 330 318 286 322 254 Z"/>
    </g>

    <path fill="#1B2432" d="M368 232 C406 240 440 264 466 300 C436 276 400 258 366 250 Z"/>

    <circle cx="350" cy="230" r="18" fill="#1B2432"/>
    <circle cx="344" cy="223" r="6.5" fill="#F5F3ED"/>
  </g>
</svg>
