<!-- Duchifat's icon: the hoopoe's face, filling the tile.

     Drawn to a picture rather than from the bird this time — the crest spread
     across the top with its dark tips, the two round eyes, the long bill down
     the middle. The face is the tile: what is drawn on top of the orange is
     only what separates one feather from the next, since the feathers and the
     face are the same colour on a hoopoe and painting them separately is how
     the first three attempts at this ended up looking like a fence.

     The white shows at the two corners only. A hoopoe's crest feather is
     cinnamon, then white, then black at the tip, and at this size the white
     band is a sliver — visible on the outermost pair, where the crest is
     spread widest, and lost under the black on the rest.

     This file is the only drawing. npm run build:icons copies it into public/
     for the manifest, renders the PNGs iOS and Android want, and writes the
     favicon into index.html as a data URI. The app bar imports it directly. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="skin" x1="0.15" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#FF8A22"/><stop offset="1" stop-color="#EF6E08"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <!-- the crest ends on a curve, so the dark between the feathers stops in
         points rather than running down to where they meet -->
    <clipPath id="crest"><path d="M-20 -20 H532 V120 C400 186 112 186 -20 120 Z"/></clipPath>

    <path id="gap" d="M256 350 L240 -140 H272 Z" fill="#17181A"/>
    <path id="tip" d="M218 -150 H294 V-20 C294 22 277 48 256 48 C235 48 218 22 218 -20 Z" fill="#17181A"/>
    <path id="band" d="M218 -40 H294 V32 C294 74 277 100 256 100 C235 100 218 74 218 32 Z" fill="#FFFFFF"/>

    <path id="eye" fill="#FFFFFF"
      d="M86 0 C134 0 172 39 172 87 L172 144 C172 192 134 231 86 231 C38 231 0 192 0 144 L0 87 C0 39 38 0 86 0 Z"/>
    <!-- the bite out of the top-left of a pupil is the shine in the eye -->
    <path id="pupil" fill="#3E4046"
      d="M44 0 C50 20 64 34 84 39 C87 48 88 57 88 66 L88 88 C88 109 78 126 44 126 C10 126 0 109 0 88 L0 40 C0 18 22 0 44 0 Z"/>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#skin)"/>

    <g clip-path="url(#crest)">
      <g>
        <use href="#gap" transform="rotate(-52 256 350)"/>
        <use href="#gap" transform="rotate(-37 256 350)"/>
        <use href="#gap" transform="rotate(-22 256 350)"/>
        <use href="#gap" transform="rotate(-7.5 256 350)"/>
        <use href="#gap" transform="rotate(7.5 256 350)"/>
        <use href="#gap" transform="rotate(22 256 350)"/>
        <use href="#gap" transform="rotate(37 256 350)"/>
        <use href="#gap" transform="rotate(52 256 350)"/>
      </g>
      <use href="#band" transform="rotate(-45 256 350)"/>
      <use href="#band" transform="rotate(45 256 350)"/>
      <g>
        <use href="#tip" transform="rotate(-45 256 350)"/>
        <use href="#tip" transform="rotate(-30 256 350)"/>
        <use href="#tip" transform="rotate(-15 256 350)"/>
        <use href="#tip"/>
        <use href="#tip" transform="rotate(15 256 350)"/>
        <use href="#tip" transform="rotate(30 256 350)"/>
        <use href="#tip" transform="rotate(45 256 350)"/>
      </g>
    </g>

    <use href="#eye" transform="translate(39 161)"/>
    <use href="#eye" transform="translate(301 161)"/>
    <use href="#pupil" transform="translate(85 209)"/>
    <use href="#pupil" transform="translate(347 209)"/>

    <path fill="#3A3C42" d="M256 512
      C248 436 228 388 210 360
      C190 328 192 310 214 304
      C234 298 248 294 256 286
      C264 294 278 298 298 304
      C320 310 322 328 302 360
      C284 388 264 436 256 512 Z"/>
    <path fill="#4B4D54" d="M256 512 C248 436 228 388 210 360 C190 328 192 310 214 304 C234 298 248 294 256 286 Z"/>
  </g>
</svg>
