    <div id="root"></div>
    <script>
      /* Boot watchdog — if the app fails to start (script 404, unsupported
         browser, misconfigured hosting), show what went wrong instead of a
         white screen. Plain ES5 on purpose: must run anywhere. */
      (function () {
        var errs = [];
        window.addEventListener(
          "error",
          function (e) {
            var t = e && e.target;
            if (t && (t.src || t.href)) errs.push("Failed to load: " + (t.src || t.href));
            else if (e && e.message) errs.push(e.message);
          },
          true
        );
        window.addEventListener("load", function () {
          setTimeout(function () {
            var root = document.getElementById("root");
            if (!root || root.children.length !== 0) return;
            var box = document.createElement("div");
            box.setAttribute(
              "style",
              "max-width:560px;margin:60px auto;padding:24px;font-family:sans-serif;color:#1B2432;background:#fff;border:1px solid #E3E1D8;border-radius:16px"
            );
            var h = document.createElement("div");
            h.setAttribute("style", "font-size:18px;font-weight:700;margin-bottom:10px");
            h.textContent = "דּוּכִיפַת couldn't start";
            box.appendChild(h);
            var p = document.createElement("div");
            p.setAttribute("style", "font-size:14px;line-height:1.6;color:#5D6675");
            p.textContent =
              "Try a hard refresh (Ctrl/Cmd+Shift+R). If you run this site and see this after a deploy, " +
              "check that GitHub Pages → Source is set to “GitHub Actions” — " +
              "“Deploy from a branch” serves unbuilt source code, which browsers can't run.";
            box.appendChild(p);
            if (errs.length) {
              var pre = document.createElement("pre");
              pre.setAttribute(
                "style",
                "margin-top:12px;padding:10px;background:#F5F3ED;border-radius:8px;font-size:12px;white-space:pre-wrap;word-break:break-all;color:#B3402E"
              );
              pre.textContent = errs.slice(0, 5).join("\n");
              box.appendChild(pre);
            }
            root.appendChild(box);
          }, 2500);
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
