<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F3ED" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161A20" media="(prefers-color-scheme: dark)" />
    <!-- Added to the iPhone home screen, this runs without Safari's chrome:
         the status bar blends into the page rather than sitting on a white
         strip, and the name under the icon is the short one. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lavan" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Lavan — a tap-to-learn Hebrew reader. Read a built-in graded story or your own Hebrew books; tap any word for its meaning, collect vocabulary, and quiz yourself."
    />
    <!-- The owl, inlined rather than linked so the single-file build stays a
         single file. Written by npm run build:icons from public/icon.svg —
         edit the drawing there, not the escaping here. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%20%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22112%22%20fill%3D%22%231D4E89%22%2F%3E%20%3Cpath%20fill%3D%22%23F5F3ED%22%20d%3D%22M112%20250%20C112%20196%20128%20156%20152%20104%20C170%20142%20190%20150%20214%20144%20C228%20139%20242%20137%20256%20137%20C270%20137%20284%20139%20298%20144%20C322%20150%20342%20142%20360%20104%20C384%20156%20400%20196%20400%20250%20C400%20322%20374%20386%20352%20424%20C334%20456%20300%20472%20256%20472%20C212%20472%20178%20456%20160%20424%20C138%20386%20112%20322%20112%20250%20Z%22%2F%3E%20%3Cg%20fill%3D%22%231D4E89%22%3E%3Ccircle%20cx%3D%22202%22%20cy%3D%22252%22%20r%3D%2258%22%2F%3E%3Ccircle%20cx%3D%22310%22%20cy%3D%22252%22%20r%3D%2258%22%2F%3E%3C%2Fg%3E%20%3Cg%20fill%3D%22%23F5F3ED%22%3E%20%3Ccircle%20cx%3D%22202%22%20cy%3D%22252%22%20r%3D%2230%22%2F%3E%3Ccircle%20cx%3D%22310%22%20cy%3D%22252%22%20r%3D%2230%22%2F%3E%20%3Cpath%20d%3D%22M256%20248%20L278%20308%20L234%20308%20Z%22%2F%3E%20%3C%2Fg%3E%20%3Cg%20fill%3D%22%231D4E89%22%3E%3Ccircle%20cx%3D%22202%22%20cy%3D%22252%22%20r%3D%2216%22%2F%3E%3Ccircle%20cx%3D%22310%22%20cy%3D%22252%22%20r%3D%2216%22%2F%3E%3C%2Fg%3E%20%3C%2Fsvg%3E" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- iOS ignores SVG here; without a PNG the home-screen icon becomes a
         blurry screenshot of the page. It is square and opaque on purpose —
         iOS rounds and masks it itself, and transparent corners come out
         black. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>לָבָן · Lavan — Hebrew Reader</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Boot watchdog — if the app fails to start (script 404, unsupported
         browser, misconfigured hosting), show what went wrong instead of a
         white screen. Plain ES5 on purpose: must run anywhere. */
      (function () {
        var errs = [];
        window.addEventListener(
          "error",
          function (e) {
            var t = e && e.target;
            if (t && (t.src || t.href)) errs.push("Failed to load: " + (t.src || t.href));
            else if (e && e.message) errs.push(e.message);
          },
          true
        );
        window.addEventListener("load", function () {
          setTimeout(function () {
            var root = document.getElementById("root");
            if (!root || root.children.length !== 0) return;
            var box = document.createElement("div");
            box.setAttribute(
              "style",
              "max-width:560px;margin:60px auto;padding:24px;font-family:sans-serif;color:#1B2432;background:#fff;border:1px solid #E3E1D8;border-radius:16px"
            );
            var h = document.createElement("div");
            h.setAttribute("style", "font-size:18px;font-weight:700;margin-bottom:10px");
            h.textContent = "לָבָן couldn't start";
            box.appendChild(h);
            var p = document.createElement("div");
            p.setAttribute("style", "font-size:14px;line-height:1.6;color:#5D6675");
            p.textContent =
              "Try a hard refresh (Ctrl/Cmd+Shift+R). If you run this site and see this after a deploy, " +
              "check that GitHub Pages → Source is set to “GitHub Actions” — " +
              "“Deploy from a branch” serves unbuilt source code, which browsers can't run.";
            box.appendChild(p);
            if (errs.length) {
              var pre = document.createElement("pre");
              pre.setAttribute(
                "style",
                "margin-top:12px;padding:10px;background:#F5F3ED;border-radius:8px;font-size:12px;white-space:pre-wrap;word-break:break-all;color:#B3402E"
              );
              pre.textContent = errs.slice(0, 5).join("\n");
              box.appendChild(pre);
            }
            root.appendChild(box);
          }, 2500);
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
