# A one-shot courier, not part of the build.
#
# When a session's git credentials fail, a commit it has already made and
# tested has no way home. This takes that commit as a patch file in the
# repository and applies it with the token Actions already has. Run it by
# hand, then delete it and the patch it carried.

name: Land a patch

on:
  workflow_dispatch:
    inputs:
      patch:
        description: Path to the patch file in this repository
        required: true
        default: .patches/review-ui.patch

jobs:
  land:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply it
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git am --keep-cr "${{ inputs.patch }}"
      - name: Push it
        run: git push origin HEAD:main
