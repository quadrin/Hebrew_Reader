name: Offline grader checks

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package*.json"
      - "vite*.config.js"
      - ".github/workflows/offline-grader.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ONNXRUNTIME_NODE_INSTALL: skip # browser build; no CUDA/native download needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:single
      - run: npm run check:offline-grader
      - run: npm run check:offline-session
      - run: npm run check:marking
      - run: npm run check:tdz
      - run: npm run check:duo
      - run: npm run check:sync
      - run: npm run check:learner
